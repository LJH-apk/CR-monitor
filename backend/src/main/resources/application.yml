spring:
  application:
    name: security-monitor
    version: 1.5.5

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:security_monitor}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootroot}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 2000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
# SECURITY WARNING: JWT_SECRET must be set as environment variable
# Generate a strong secret key using: openssl rand -base64 64
jwt:
  secret: ${JWT_SECRET:please-change-this-weak-default-key-in-production-use-at-least-256-bits-for-security}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# Storage Configuration
storage:
  base-path: ${STORAGE_BASE_PATH:/Users/liujiahang/Page/backend/storage}
  uploads: ${storage.base-path}/uploads
  transcoded: ${storage.base-path}/transcoded
  thumbnails: ${storage.base-path}/thumbnails
  training-samples: ${storage.base-path}/training-samples

# Image Upload Configuration
image-upload:
  max-size: 10485760  # 10MB in bytes
  allowed-types: image/jpeg,image/png,image/jpg
  max-width: 4096
  max-height: 4096

# FFmpeg Configuration
ffmpeg:
  path: ffmpeg
  hls-time: 10  # seconds per segment
  preset: medium  # ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow

# AI Service Configuration
ai-service:
  base-url: http://localhost:5001
  timeout: 30000  # 30 seconds
  enabled: true

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Frame Extraction Configuration
frame-extraction:
  interval: 30  # extract 1 frame every 30 frames
  min-interval-seconds: 2  # minimum time interval between analyses

# Frame Analysis Configuration
frame-analysis:
  consecutive-frames: 3  # 连续多少帧检测到相同异常才触发预警
  cycle-frames: 5  # 检测周期帧数，周期内无异常则显示绿色状态
  realtime-interval: 2  # 实时分析间隔（秒），每隔多少秒分析一次

# Logging
logging:
  level:
    root: INFO
    com.security.monitor: INFO
    org.springframework.security: WARN
