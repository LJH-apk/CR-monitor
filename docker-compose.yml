services:
  # ==================== 数据库服务 ====================
  mysql:
    image: mysql:8.0
    container_name: security-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootroot}
      MYSQL_DATABASE: ${DB_NAME:-security_monitor}
      MYSQL_USER: ${DB_USERNAME:-monitor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-monitor123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
    networks:
      - security-monitor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== Redis服务 ====================
  redis:
    image: redis:7.0-alpine
    container_name: security-monitor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - security-monitor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-monitor-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-security_monitor}
      DB_USERNAME: ${DB_USERNAME:-monitor}
      DB_PASSWORD: ${DB_PASSWORD:-monitor123}

      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # JWT配置
      JWT_SECRET: ${JWT_SECRET:-please-change-this-weak-default-key-in-production-use-at-least-256-bits-for-security}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # 存储配置
      STORAGE_BASE_PATH: /app/storage

      # AI服务配置
      AI_SERVICE_BASE_URL: http://ai-service:5001

      # CORS配置
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000}

      # Spring配置
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # JVM配置
      JAVA_OPTS: "-Xms512m -Xmx2g"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage
    networks:
      - security-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ==================== AI服务 ====================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: security-monitor-ai
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-sk-6963e4b8bb5840de98983e63ed1ae012}
      YOLO_MODEL_PATH: /app/yolo11n.pt
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "${AI_SERVICE_PORT:-5001}:5001"
    volumes:
      - ./ai-service/yolo11n.pt:/app/yolo11n.pt:ro
    networks:
      - security-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: security-monitor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - security-monitor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

# ==================== 网络配置 ====================
networks:
  security-monitor-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==================== 存储卷配置 ====================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
